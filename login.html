<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Sign in</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f3f6fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
      }

      .login-card {
        width: min(100%, 420px);
        padding: 40px;
        border: 1px solid #e3e8f0;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 18px 50px rgb(23 32 51 / 8%);
      }

      h1 {
        margin: 0;
        font-size: 1.8rem;
        letter-spacing: -0.04em;
      }

      .intro {
        margin: 10px 0 30px;
        color: #647084;
        line-height: 1.5;
      }

      .field {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.9rem;
        font-weight: 600;
      }

      input[type="email"],
      input[type="password"] {
        width: 100%;
        min-height: 48px;
        padding: 12px 14px;
        border: 1px solid #cbd3df;
        border-radius: 8px;
        background: #fff;
        color: inherit;
        font: inherit;
      }

      input:focus-visible,
      button:focus-visible {
        outline: 3px solid rgb(57 105 232 / 28%);
        outline-offset: 2px;
      }

      input[type="email"]:focus,
      input[type="password"]:focus {
        border-color: #3969e8;
      }

      .remember {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 2px 0 24px;
        color: #465267;
        font-size: 0.9rem;
      }

      .remember input {
        width: 16px;
        height: 16px;
        margin: 0;
        accent-color: #315ed0;
      }

      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 8px;
        background: #315ed0;
        color: #fff;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button:hover {
        background: #254db6;
      }

      @media (max-width: 480px) {
        .login-card {
          padding: 30px 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="login-card">
      <h1>Welcome back</h1>
      <p class="intro">Sign in to continue to your account.</p>

      <form method="post">
        <div class="field">
          <label for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
          >
        </div>

        <label class="remember" for="remember">
          <input id="remember" name="remember" type="checkbox">
          Remember me
        </label>

        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
